name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    tests:
        name: 'Tests on ${{ matrix.php }} (deps=${{ matrix.deps }}, symfony=${{ matrix.symfony }})'
        runs-on: ubuntu-latest

        env:
            SYMFONY_DEPRECATIONS_HELPER: 'max[self]=0'

        strategy:
            fail-fast: false
            matrix:
                include:
                    # Test lowest dependencies
                    - php: '7.2'
                      deps: lowest
                      symfony: '^5.4'

                    # Test LTS versions
                    - php: '7.4'
                      deps: highest
                      symfony: '^5.4'

                    - php: '8.1'
                      deps: highest
                      symfony: '^6.4'

                    - php: '8.3'
                      deps: highest
                      symfony: '^7.4'

                    # Test the latest stable version
                    - php: '8.5'
                      deps: highest
                      symfony: '^8.1'

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  php-version: '${{ matrix.php }}'
                  tools: 'composer:v2, flex'

            - name: Configure Symfony version
              run: 'echo SYMFONY_REQUIRE="${{ matrix.symfony }}" >> $GITHUB_ENV'

            - name: Configure Composer
              run: |
                  composer config minimum-stability dev
                  composer config prefer-stable true
                  # Test the versions we support even when they are affected by security advisories
                  composer config audit.block-insecure false

            - name: Composer install
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: '${{ matrix.deps }}'
                  composer-options: '--prefer-dist'

            - name: Install PHPUnit
              run: vendor/bin/simple-phpunit install

            - name: Run tests
              run: vendor/bin/simple-phpunit

    cs:
        name: 'Code Style'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: PHP-CS-Fixer
              uses: docker://oskarstark/php-cs-fixer-ga:3.0.0
              with:
                  args: --diff --dry-run
